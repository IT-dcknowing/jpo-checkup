<body>
<div id="app"></div>

<!-- Gabarit de l'application (lu par assets/js/dc-runtime.js) -->

</button>

<sc-if value="{{headerCta}}" hint-placeholder-val="{{true}}"><button type="button" class="btn btn-a btn-sm" onClick="{{start}}" style="margin-left: 6px">Faire mon diagnostic</button></sc-if>

</nav>
</div>

<main style="flex: 1; width: 100%">

<!-- ========== ÉCRAN 1 : ACCUEIL ========== -->

</div>
<p style="margin-top: 14px; font-size: 14px">Déjà fait votre diagnostic ? <button type="button" class="btn btn-t btn-sm" onClick="{{openEspace}}" style="text-decoration: underline; text-decoration-color: #FFD700; text-decoration-thickness: 2px; padding: 0 6px">Retrouver mes diagnostics</button></p>

<span style="display: inline-flex; align-items: center; gap: 8px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Rapport en 10 minutes maximum</span>

</section>

<div style="display: flex; gap: 28px; flex-wrap: wrap">

<span class="m" style="width: 44px; height: 44px; display: grid; place-items: center; background: #FFD700; border: 1px solid #000000; border-radius: 12px; font-weight: 700; font-size: 18px">01</span>
<h3 style="font-size: 18px">Identifiez-vous par e-mail</h3>

<p class="micro" style="color: #FFD700">Confidentialité · loi n°2013-450</p>

<section style="padding: 72px 0 0" aria-labelledby="h-flow">

<!-- ========== CONNEXION PAR CODE ========== -->
<sc-if value="{{show.auth}}" hint-placeholder-val="{{false}}">
<div style="max-width: 1040px; margin: 0 auto; padding: 56px 24px 0; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">
<div style="flex: 1 1 380px; min-width: 0" class="up">
<button type="button" class="btn btn-t btn-sm" data-son="clic" onClick="{{authBack}}" style="margin-left: -12px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>{{authBackL}}</button>
<p class="micro" style="margin-top: 20px">{{authKicker}}</p>
<h1 style="font-size: clamp(2rem, 3.6vw, 2.8rem); margin-top: 10px; font-family: Poppins, Sora, sans-serif; font-weight: 800">{{authTitle}}</h1>
<p style="font-size: 17px; color: #525252; margin-top: 12px; max-width: 46ch">{{authLead}}</p>
<ol style="list-style: none; margin: 28px 0 0; padding: 0; display: grid; gap: 14px">
<li style="display: flex; gap: 14px; align-items: flex-start"><span class="m" style="width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; flex: none; background: {{a1bg}}; color: {{a1fg}}; border: 1px solid #000000">1</span><div><b>Votre e-mail professionnel</b><p class="hint">Il sert d’identifiant : pas de mot de passe à retenir.</p></div></li>
<li style="display: flex; gap: 14px; align-items: flex-start"><span class="m" style="width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; flex: none; background: {{a2bg}}; color: {{a2fg}}; border: 1px solid #000000">2</span><div><b>Le code à 6 chiffres reçu par e-mail</b><p class="hint">Copiez-le, collez-le, validez. Il expire après 10 minutes.</p></div></li>
<li style="display: flex; gap: 14px; align-items: flex-start"><span class="m" style="width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; flex: none; background: #FFFFFF; color: #525252; border: 1px solid #E0E0E0">3</span><div><b>{{authStep3}}</b><p class="hint">{{authStep3d}}</p></div></li>
</ol>
</div>

<div style="flex: 1 1 400px; min-width: 0">
<sc-if value="{{authEmailStep}}" hint-placeholder-val="{{true}}">
<form class="card glass up d1" onSubmit="{{sendCode}}" noValidate="{{true}}" style="padding: 32px; display: flex; flex-direction: column; gap: 18px" aria-labelledby="t-mail">
<span style="width: 56px; height: 56px; border-radius: 16px; background: #FFD700; border: 1px solid #000000; display: grid; place-items: center"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 26px; height: 26px"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg></span>
<h2 id="t-mail" style="font-size: 22px">Quelle est votre adresse e-mail ?</h2>
<div class="fld"><label class="lbl" for="a-mail">E-mail professionnel</label><input id="a-mail" type="email" class="{{authMailCls}}" value="{{auth.email}}" onChange="{{onAuthEmail}}" placeholder="direction@entreprise.ci" autoComplete="email" aria-invalid="{{authMailInv}}"><sc-if value="{{auth.err}}" hint-placeholder-val="{{false}}"><span class="hint e" role="alert">{{auth.err}}</span></sc-if></div>
<button type="submit" class="btn btn-p btn-lg {{authBusyCls}}" style="width: 100%">Recevoir mon code<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
<p class="hint" style="display: flex; gap: 8px; align-items: flex-start"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; margin-top: 1px"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Votre e-mail sert uniquement à vous envoyer le code et votre rapport.</p>
</form>
</sc-if>

<sc-if value="{{authCodeStep}}" hint-placeholder-val="{{false}}">
<form class="card glass up" onSubmit="{{verifyCode}}" noValidate="{{true}}" style="padding: 32px; display: flex; flex-direction: column; gap: 18px" aria-labelledby="t-code">
<span style="width: 56px; height: 56px; border-radius: 16px; background: #000000; color: #FFD700; display: grid; place-items: center"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 26px; height: 26px"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span>
<div><h2 id="t-code" style="font-size: 22px">Saisissez le code reçu</h2>
<p style="font-size: 14px; color: #525252; margin-top: 6px">Envoyé à <b style="color: #000000">{{auth.email}}</b> · <button type="button" class="btn btn-t btn-sm" onClick="{{changeEmail}}" style="min-height: 28px; padding: 0 6px; text-decoration: underline; text-decoration-color: #FFD700; text-decoration-thickness: 2px">modifier</button></p></div>
<div class="fld"><label class="lbl" for="a-code">Code à 6 chiffres</label><input id="a-code" class="{{otpCls}}" value="{{auth.code}}" onChange="{{onCode}}" inputMode="numeric" autoComplete="one-time-code" maxLength="6" placeholder="······" aria-invalid="{{codeInv}}" aria-describedby="h-code"><sc-if value="{{auth.err}}" hint-placeholder-val="{{false}}"><span id="h-code" class="hint e" role="alert">{{auth.err}}</span></sc-if></div>

<button type="button" class="btn btn-g btn-sm" onClick="{{resend}}" disabled="{{resendWait}}">{{resendL}}</button>
</div>
<sc-if value="{{demo}}" hint-placeholder-val="{{false}}"><p style="padding: 10px 12px; border-radius: 12px; background: #FEF9E7; border: 1px dashed #F2C200; font-size: 12px"><b>Mode démo :</b> le code de démonstration est <span class="m" style="font-weight: 700">482913</span>.</p></sc-if>
</form>
</sc-if>
</div>
</div>
</sc-if>

<!-- ========== FORMULAIRE EN 6 ÉTAPES COURTES ========== -->
<sc-if value="{{show.form}}" hint-placeholder-val="{{false}}">
<div style="max-width: 1200px; margin: 0 auto; padding: 28px 24px 0">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<button type="button" class="btn btn-t btn-sm" onClick="{{askQuit}}" style="margin-left: -12px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>Quitter</button>
<div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap"><span class="saved"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px"><path d="M4 12l5 5L20 6"></path></svg>Brouillon enregistré</span><sc-if value="{{demo}}" hint-placeholder-val="{{false}}"><button type="button" class="btn btn-g btn-sm" onClick="{{fillSample}}">Remplir avec un exemple</button></sc-if></div>
</div>

<nav aria-label="Étapes du diagnostic" style="margin-top: 18px">
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="6">
<li style="display: flex; align-items: center; gap: 8px">
<button type="button" class="stp {{s.cls}}" onClick="{{s.go}}" disabled="{{s.dis}}" aria-current="{{s.ac}}">
<span class="c"><sc-if value="{{s.done}}" hint-placeholder-val="{{false}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M4 12l5 5L20 6"></path></svg></sc-if><sc-if value="{{s.notDone}}" hint-placeholder-val="{{true}}">{{s.n}}</sc-if></span>
<span>{{s.l}}</span>
</button>
<sc-if value="{{s.sep}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="width: 20px; height: 2px; background: {{s.sepColor}}; border-radius: 2px"></span></sc-if>
</li>
</sc-for>
</ol>
<div class="bar" style="margin-top: 12px" role="progressbar" aria-label="Progression du diagnostic" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{stepPct}}"><i style="width: {{stepPct}}%"></i></div>
</nav>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; margin-top: 24px">
<form class="card" onSubmit="{{submitForm}}" noValidate="{{true}}" style="flex: 999 1 560px; min-width: 0; padding: 32px; display: flex; flex-direction: column; gap: 24px">
<div>
<p class="micro">Étape {{step}} sur 6 · {{remainForm}}</p>
<h2 style="font-size: clamp(1.5rem, 2.6vw, 1.9rem); margin-top: 8px; font-family: Poppins, Sora, sans-serif; font-weight: 800">{{stepTitle}}</h2>
<p class="muted" style="font-size: 15px; margin-top: 6px; max-width: 60ch">{{stepWhy}}</p>
</div>

<!-- 1 · Entreprise -->
<sc-if value="{{show.s1}}" hint-placeholder-val="{{true}}">
<div class="up" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px">
<div class="fld" style="grid-column: 1 / -1"><label class="lbl" for="f-raison">Raison sociale</label><input id="f-raison" class="{{cls.raison}}" value="{{f.raison}}" onChange="{{on.raison}}" placeholder="Ex. Ivoire Négoce SARL" autoComplete="organization" aria-invalid="{{inv.raison}}"><sc-if value="{{err.raison}}" hint-placeholder-val="{{false}}"><span class="hint e">{{err.raison}}</span></sc-if></div>
<div class="fld"><label class="lbl" for="f-secteur">Secteur d’activité</label><select id="f-secteur" class="{{cls.secteur}}" value="{{f.secteur}}" onChange="{{on.secteur}}" aria-invalid="{{inv.secteur}}"><option value="">Choisir un secteur…</option><sc-for list="{{secteurs}}" as="o" hint-placeholder-count="6"><option value="{{o}}">{{o}}</option></sc-for></select><sc-if value="{{err.secteur}}" hint-placeholder-val="{{false}}"><span class="hint e">{{err.secteur}}</span></sc-if><sc-if value="{{exempt}}" hint-placeholder-val="{{false}}"><span class="hint" style="color: #785C03; font-weight: 600">Secteur exempté de FNE : la question FNE ne vous sera pas posée.</span></sc-if></div>
<div class="fld"><label class="lbl" for="f-eff">Effectif</label><input id="f-eff" type="number" min="1" inputMode="numeric" class="{{cls.effectif}}" value="{{f.effectif}}" onChange="{{on.effectif}}" placeholder="Nombre de salariés" aria-invalid="{{inv.effectif}}"><sc-if value="{{err.effectif}}" hint-placeholder-val="{{false}}"><span class="hint e">{{err.effectif}}</span></sc-if></div>
<div class="fld" style="grid-column: 1 / -1"><label class="lbl" for="f-ncc">NCC <span class="opt">(facultatif)</span></label><input id="f-ncc" class="in m" value="{{f.ncc}}" onChange="{{on.ncc}}" placeholder="Numéro de compte contribuable" style="max-width: 320px"><span class="hint">Masqué avant toute analyse.</span></div>
</div>
</sc-if>

<!-- 2 · Vous -->
<sc-if value="{{show.s2}}" hint-placeholder-val="{{false}}">
<div class="up" style="display: flex; flex-direction: column; gap: 20px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px">
<div class="fld"><label class="lbl" for="f-nom">Nom et prénom</label><input id="f-nom" class="{{cls.nom}}" value="{{f.nom}}" onChange="{{on.nom}}" placeholder="Ex. Aïcha Koné" autoComplete="name" aria-invalid="{{inv.nom}}"><sc-if value="{{err.nom}}" hint-placeholder-val="{{false}}"><span class="hint e">{{err.nom}}</span></sc-if></div>
<div class="fld"><label class="lbl" for="f-tel">Téléphone mobile</label><input id="f-tel" type="tel" class="{{cls.tel}} m" value="{{f.tel}}" onChange="{{on.tel}}" placeholder="07 00 00 00 00" autoComplete="tel" aria-invalid="{{inv.tel}}"><sc-if value="{{err.tel}}" hint-placeholder-val="{{false}}"><span class="hint e">{{err.tel}}</span></sc-if><sc-if value="{{noErr.tel}}" hint-placeholder-val="{{true}}"><span class="hint">Seulement pour le rappel d’un conseiller.</span></sc-if></div>
<div class="fld" style="grid-column: 1 / -1"><span class="lbl">E-mail du rapport</span><div style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; border-radius: 14px; background: #FAFAF7; border: 1.5px solid #E0E0E0; font-size: 14px"><b style="flex: 1; overflow: hidden; text-overflow: ellipsis">{{userEmail}}</b><span class="bdg b-ok"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px"><path d="M4 12l5 5L20 6"></path></svg>Vérifié</span></div></div>
</div>
<div class="fld"><span class="lbl" id="l-type">Votre relation avec DC-KNOWING</span>
<div role="group" aria-labelledby="l-type" style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{typeOpts}}" as="o" hint-placeholder-count="3"><button type="button" class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.l}}</button></sc-for></div>
<sc-if value="{{err.typeClient}}" hint-placeholder-val="{{false}}"><span class="hint e">{{err.typeClient}}</span></sc-if></div>
<div class="fld"><span class="lbl" id="l-jour">Quels jours viendrez-vous ?</span>
<div role="group" aria-labelledby="l-jour" style="display: grid; gap: 8px"><sc-for list="{{jourOpts}}" as="o" hint-placeholder-count="3"><label class="{{o.cls}}"><input type="checkbox" checked="{{o.checked}}" onChange="{{o.toggle}}"><span><b>{{o.l}}</b><span class="hint">{{o.d}}</span></span></label></sc-for></div>
<button type="button" class="btn btn-g btn-sm" data-son="clic" onClick="{{allDays}}" style="align-self: flex-start">Je viens les 3 jours</button>
<sc-if value="{{err.jours}}" hint-placeholder-val="{{false}}"><span class="hint e">{{err.jours}}</span></sc-if>
<span class="hint">Siège DC-KNOWING, Cocody Riviera 2 · votre invitation liste les jours cochés.</span></div>
<div class="fld"><span class="lbl">Votre entretien individuel</span>
<span class="hint">45 minutes avec un expert, accueil compris. Facultatif : vous pourrez aussi réserver depuis votre résultat. Touchez de nouveau un créneau pour l’annuler.</span>
<sc-if value="{{noDays}}" hint-placeholder-val="{{false}}"><span class="hint">Cochez d’abord vos jours de visite.</span></sc-if>
<sc-for list="{{formSlots}}" as="g" hint-placeholder-count="1"><div style="display: grid; gap: 8px; margin-top: 6px"><b style="font-size: 13px">{{g.l}}</b><div role="group" aria-label="{{g.l}}" class="creneaux"><sc-for list="{{g.slots}}" as="s" hint-placeholder-count="6"><button type="button" class="{{s.cls}} m" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}" disabled="{{s.dis}}" aria-label="{{s.aria}}">{{s.t}}</button></sc-for></div></div></sc-for>
<sc-if value="{{daysFull}}" hint-placeholder-val="{{false}}"><span class="hint e">Plus de place sur vos jours : cochez un autre jour.</span></sc-if></div>
</div>
</sc-if>

<!-- 3 · Fiscalité -->
<sc-if value="{{show.s3}}" hint-placeholder-val="{{false}}">
<div class="up" style="display: flex; flex-direction: column; gap: 22px">
<div class="fld"><span class="lbl" id="l-regime">Régime fiscal déclaré</span>
<div role="group" aria-labelledby="l-regime" style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{regimeOpts}}" as="o" hint-placeholder-count="5"><button type="button" class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.l}}</button></sc-for></div>
<span class="hint m">Repères CA HT : TEE 5–50 M · RME 50–200 M · Réel simplifié 200–500 M · Réel normal &gt; 500 M</span>
<sc-if value="{{err.regime}}" hint-placeholder-val="{{false}}"><span class="hint e">{{err.regime}}</span></sc-if></div>
<sc-if value="{{notExempt}}" hint-placeholder-val="{{true}}">
<div class="fld"><span class="lbl" id="l-fne">Facture normalisée électronique (FNE)</span>
<div role="group" aria-labelledby="l-fne" style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{fneOpts}}" as="o" hint-placeholder-count="4"><button type="button" class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.l}}</button></sc-for></div>
<sc-if value="{{err.fne}}" hint-placeholder-val="{{false}}"><span class="hint e">{{err.fne}}</span></sc-if></div>
</sc-if>
<sc-if value="{{exempt}}" hint-placeholder-val="{{false}}"><p class="bdg b-acc" style="align-self: flex-start">FNE : non applicable, secteur exempté</p></sc-if>
<div class="fld"><span class="lbl" id="l-tva">Votre activité est-elle exonérée de TVA ?</span>
<div role="group" aria-labelledby="l-tva" style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{tvaOpts}}" as="o" hint-placeholder-count="2"><button type="button" class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.l}}</button></sc-for></div>
<sc-if value="{{err.tva}}" hint-placeholder-val="{{false}}"><span class="hint e">{{err.tva}}</span></sc-if></div>
</div>
</sc-if>

<!-- 4 · Obligations -->
<sc-if value="{{show.s4}}" hint-placeholder-val="{{false}}">
<div class="up" style="display: flex; flex-direction: column; gap: 6px">
<div style="border-top: 1px solid #E0E0E0">
<sc-for list="{{statRows}}" as="r" hint-placeholder-count="5">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 12px 0; border-bottom: 1px solid #E0E0E0">
<div style="min-width: 200px"><b class="d" style="font-size: 15px">{{r.k}}</b><span class="hint" style="display: block">{{r.d}}</span></div>
<div role="group" aria-label="{{r.aria}}" style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{r.opts}}" as="o" hint-placeholder-count="3"><button type="button" class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.l}}</button></sc-for></div>
</div>
</sc-for>
</div>
<sc-if value="{{err.statuts}}" hint-placeholder-val="{{false}}"><span class="hint e">{{err.statuts}}</span></sc-if>
<button type="button" class="btn btn-t btn-sm" onClick="{{allUpToDate}}" style="align-self: flex-start; margin-top: 6px">Tout est à jour</button>
</div>
</sc-if>

<!-- 5 · Documents -->
<sc-if value="{{show.s5}}" hint-placeholder-val="{{false}}">
<div class="up" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
<span class="bdg {{fileCountCls}}">{{fileCount}} / 10 fichiers</span>
<sc-if value="{{showSampleFiles}}" hint-placeholder-val="{{false}}"><button type="button" class="btn btn-t btn-sm" onClick="{{sampleFiles}}">Utiliser des fichiers d’exemple</button></sc-if>
</div>
<sc-for list="{{docSlots}}" as="d" hint-placeholder-count="4">
<div>
<sc-if value="{{d.isEmpty}}" hint-placeholder-val="{{true}}">
<label class="slot {{d.over}}" onDragOver="{{d.dragOver}}" onDragEnter="{{d.dragOver}}" onDragLeave="{{d.dragLeave}}" onDrop="{{d.drop}}">
<input class="vh" type="file" accept=".csv,.xlsx,.pdf" multiple onChange="{{d.pick}}" aria-label="{{d.aria}}">
<span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"></path></svg></span>
<span style="flex: 1; min-width: 0"><span style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap"><b style="font-size: 15px">{{d.l}}</b><sc-if value="{{d.rec}}" hint-placeholder-val="{{false}}"><span class="bdg b-acc" style="padding: 1px 8px">Recommandé</span></sc-if></span><span class="hint" style="display: block">{{d.d}}</span></span>
<span class="btn btn-g btn-sm" aria-hidden="true">Choisir</span>
</label>
</sc-if>
<sc-if value="{{d.isOff}}" hint-placeholder-val="{{false}}">
<div class="slot off"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"></path></svg></span><span style="flex: 1"><b style="font-size: 15px">{{d.l}}</b><span class="hint" style="display: block">Maximum de 10 fichiers atteint.</span></span></div>
</sc-if>
<sc-if value="{{d.isFilled}}" hint-placeholder-val="{{false}}">
<div class="slot filled">
<span class="ic">{{d.ext}}</span>
<span style="flex: 1; min-width: 0"><span class="micro" style="color: #15803D">{{d.l}} · prêt</span><b style="display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{d.name}}</b><span style="display: flex; align-items: center; gap: 10px; margin-top: 4px"><span class="bar" style="flex: 1; height: 5px"><i style="width: 100%; background: #15803D; animation: grow 1s cubic-bezier(.2,.8,.2,1) both"></i></span><span class="hint m">{{d.size}}</span></span></span>
<label class="btn btn-g btn-sm" style="position: relative">Remplacer<input class="vh" type="file" accept=".csv,.xlsx,.pdf" onChange="{{d.pick}}" aria-label="{{d.replaceAria}}"></label>
<button type="button" class="btn btn-t btn-sm btn-ic" onClick="{{d.remove}}" aria-label="{{d.removeAria}}" style="width: 36px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</sc-if>
</div>
</sc-for>
<sc-if value="{{err.files}}" hint-placeholder-val="{{false}}"><span class="hint e">{{err.files}}</span></sc-if>
<p class="hint"><b>Idéal : la balance générale</b> (ou le compte de résultat et le bilan). Journaux de ventes, d’achats ou de paie et grand livre sont aussi acceptés : le diagnostic porte alors sur les parties qu’ils couvrent.</p>
<p class="hint">CSV ou XLSX exportés de votre logiciel : lecture la plus rapide. PDF natif ou numérisé accepté. 20 Mo maximum par fichier.</p>
</div>
</sc-if>

<!-- 6 · Vérification -->
<sc-if value="{{show.s6}}" hint-placeholder-val="{{false}}">
<div class="up" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px">
<sc-for list="{{recap}}" as="g" hint-placeholder-count="5">
<section class="rgrp" aria-label="{{g.t}}">
<div style="display: flex; justify-content: space-between; align-items: center"><h3 style="font-size: 15px">{{g.t}}</h3><button type="button" class="btn btn-t btn-sm" onClick="{{g.edit}}" aria-label="{{g.editL}}" style="min-height: 32px">Modifier</button></div>
<dl style="margin: 0; display: grid; gap: 6px"><sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3"><div class="rrow"><dt>{{r.l}}</dt><dd>{{r.v}}</dd></div></sc-for></dl>
</section>
</sc-for>
</div>
<div style="padding: 18px; border-radius: 18px; background: #FAFAF7; border: 1px solid #E0E0E0; display: flex; flex-direction: column; gap: 8px">
<label style="display: flex; gap: 12px; align-items: flex-start; font-size: 14px; cursor: pointer; min-height: 44px">
<input type="checkbox" checked="{{f.consent}}" onChange="{{toggleConsent}}" style="width: 20px; height: 20px; accent-color: #000000; margin-top: 2px; flex: none" aria-invalid="{{inv.consent}}">
<span>J’accepte que DC-KNOWING traite mes documents pour produire ce diagnostic, dans les conditions de la notice d’information (loi n°2013-450, ARTCI).</span>
</label>
<button type="button" class="btn btn-t btn-sm" onClick="{{openNotice}}" style="align-self: flex-start; text-decoration: underline; text-decoration-color: #FFD700; text-decoration-thickness: 2px">Lire la notice d’information</button>
<sc-if value="{{err.consent}}" hint-placeholder-val="{{false}}"><span class="hint e">{{err.consent}}</span></sc-if>
</div>
</div>
</sc-if>

<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 20px; border-top: 1px solid #E0E0E0">
<sc-if value="{{canBack}}" hint-placeholder-val="{{false}}"><button type="button" class="btn btn-g" data-son="clic" onClick="{{back}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>Précédent</button></sc-if>
<sc-if value="{{noBack}}" hint-placeholder-val="{{true}}"><span class="hint">Tous les champs sont obligatoires sauf mention.</span></sc-if>
<sc-if value="{{notLast}}" hint-placeholder-val="{{true}}"><button type="submit" class="btn btn-p btn-lg">Continuer<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button></sc-if>
<sc-if value="{{isLast}}" hint-placeholder-val="{{false}}"><button type="submit" class="btn btn-a btn-lg {{launchCls}}">Lancer mon diagnostic<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button></sc-if>
</div>
</form>

<aside style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div class="card glass" style="padding: 22px">
<p class="micro">Votre dossier</p>
<dl style="margin: 12px 0 0; display: grid; gap: 10px; font-size: 14px">
<sc-for list="{{summary}}" as="r" hint-placeholder-count="5"><div class="rrow"><dt>{{r.l}}</dt><dd>{{r.v}}</dd></div></sc-for>
</dl>
</div>
<div class="card dark dk" style="padding: 22px; display: flex; flex-direction: column; gap: 10px">
<span class="micro" style="color: #FFD700">Après l’envoi</span>
<p class="m" style="font-size: 26px; font-weight: 700; line-height: 1">≈ 5 min 30</p>
<p style="color: #D4D4D4; font-size: 13px">Rapport par e-mail en 10 minutes maximum, et toujours disponible dans « Mes diagnostics ».</p>
</div>
<p class="hint" style="padding: 0 6px">Besoin d’aide ? 27 22 42 14 43 / 07 67 13 19 93</p>
</aside>
</div>
</div>
</sc-if>

<!-- ========== ÉCRAN 3 : SUIVI EN DIRECT ========== -->
<sc-if value="{{show.suivi}}" hint-placeholder-val="{{false}}">
<div style="max-width: 1100px; margin: 0 auto; padding: 40px 24px 0">
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<section class="card up" style="padding: 28px; display: flex; flex-direction: column; gap: 22px" aria-live="polite">
<div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start">
<div>
<sc-if value="{{running}}" hint-placeholder-val="{{true}}"><p class="micro" style="display: flex; align-items: center; gap: 8px"><span class="dot"></span>Analyse en cours</p><h1 style="font-size: clamp(1.6rem, 3vw, 2.1rem); margin-top: 8px">Nous préparons votre diagnostic</h1></sc-if>
<sc-if value="{{failed}}" hint-placeholder-val="{{false}}"><p class="micro" style="color: #DC2626">Traitement interrompu</p><h1 style="font-size: clamp(1.6rem, 3vw, 2.1rem); margin-top: 8px">Lecture automatique impossible</h1></sc-if>
<sc-if value="{{allDone}}" hint-placeholder-val="{{false}}"><p class="micro" style="color: #15803D">Terminé</p><h1 style="font-size: clamp(1.6rem, 3vw, 2.1rem); margin-top: 8px">Rapport envoyé</h1></sc-if>
<p class="muted" style="font-size: 14px; margin-top: 6px">{{entreprise}} · envoi à <b style="color: #000000">{{emailShown}}</b></p>
</div>
<span class="bdg b-info m">Réf. {{job}}</span>

<sc-if value="{{m.notice}}" hint-placeholder-val="{{false}}">
<div class="ov" onClick="{{ovClick}}" onKeyDown="{{ovKey}}">
<div class="mdl" role="dialog" aria-modal="true" aria-labelledby="t-notice" style="width: min(620px, 100%)">
<div class="mh"><h3 id="t-notice" style="font-size: 18px">Notice d’information — vos données</h3><button type="button" class="btn btn-g btn-ic btn-sm" onClick="{{closeModal}}" aria-label="Fermer" style="width: 36px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
<div class="mb" style="display: flex; flex-direction: column; gap: 12px">
<p class="muted">Traitement réalisé par le cabinet DC-KNOWING dans le cadre de la loi n°2013-450 relative à la protection des données à caractère personnel (ARTCI).</p>
<ul style="margin: 0; padding-left: 18px; display: grid; gap: 8px">
<li><b>Finalité :</b> produire votre diagnostic financier et de conformité, puis préparer votre entretien.</li>
<li><b>Anonymisation :</b> avant tout appel à l’IA, votre raison sociale, votre NCC, vos nom, e-mail et téléphone, les RIB/IBAN, ainsi que les noms des clients, fournisseurs et salariés de vos documents sont remplacés par des codes ; le détail des journaux et bulletins de paie n’est jamais transmis (seuls les totaux le sont). Dans un PDF, un nom cité seul au fil du texte peut échapper à ce traitement : préférez CSV ou XLSX pour les journaux nominatifs.</li>
<li><b>IA :</b> l’analyse passe par OpenRouter avec des modèles gratuits : les fournisseurs de ces modèles peuvent conserver et réutiliser les données transmises (les noms sont remplacés par des codes, les montants restent lisibles).</li>
<li><b>Sous-traitants :</b> Supabase (base de données et fichiers), Vercel (application), OpenRouter (IA) et Resend (e-mails) ; certains traitements ont lieu hors de Côte d’Ivoire.</li>
<li><b>Sécurité :</b> chiffrement en transit et au repos ; accès limité à votre compte ; les consultations, exports et actions des conseillers sont journalisés.</li>
<li><b>Conservation :</b> fichiers bruts supprimés dès l’analyse terminée, et au plus tard après 24 h ; diagnostic et rapport supprimés après 30 jours ; journal des accès conservé 12 mois. Vous pouvez tout supprimer à tout moment depuis « Mes diagnostics ».</li>
<li><b>Limites :</b> ce diagnostic n’est ni un audit, ni une certification des comptes, ni un avis juridique.</li>
</ul>
<p class="hint">Pour exercer vos droits : infos@dc-knowing.com · 27 22 42 14 43.</p>
</div>
<div class="mf"><button type="button" class="btn btn-g" onClick="{{closeModal}}">Fermer</button><button type="button" class="btn btn-a" onClick="{{acceptNotice}}">J’accepte</button></div>
</div>
</div>
</sc-if>
